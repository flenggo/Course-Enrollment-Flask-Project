{% extends "layout.html" %}

{% block content %}

<div class="container mt-5">
    <h2 class="text-center mb-4">{{ title }}</h2>

    <!-- Enrollment Form -->
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-success text-white">
                    <h5 class="mb-0">Enroll in a New Course</h5>
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('routes.enroll_course') }}">
                        <div class="form-group">
                            <label for="courseID">Course ID</label>
                            <input type="text" class="form-control" name="courseID" required>
                        </div>
                        <div class="form-group">
                            <label for="title">Course Title</label>
                            <input type="text" class="form-control" name="title" required>
                        </div>
                        <div class="form-group">
                            <label for="description">Description</label>
                            <textarea class="form-control" name="description" rows="2" required></textarea>
                        </div>
                        <div class="form-group">
                            <label for="credits">Credits</label>
                            <input type="number" class="form-control" name="credits" required>
                        </div>
                        <div class="form-group">
                            <label for="term">Term</label>
                            <input type="text" class="form-control" name="term" required>
                        </div>
                        <button type="submit" class="btn btn-success mt-2">Enroll</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
